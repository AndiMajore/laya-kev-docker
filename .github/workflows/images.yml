name: Build images

# Builds the laya and kev images, checks them without a GPU, and publishes them to GHCR
# as ghcr.io/<owner>/<repo>/{laya,kev}. Build args come from .env.example, so CI builds
# exactly the versions a local `make up` builds. Pull requests build and test only.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: laya
            dockerfile: Dockerfile
            # Imports the server without starting it; CUDA itself needs a GPU runner.
            check: |
              from importlib.metadata import version
              import laya.serve, fastapi, uvicorn, torch
              print("laya", version("laya"), "torch", torch.__version__, "cuda", torch.version.cuda)
          - name: kev
            dockerfile: kev/Dockerfile
            # Importing the wrapper also validates its warm-up request against kev's schema.
            check: |
              import sys; sys.path.insert(0, "/opt/kev")
              import kev_serve, fla, torch
              print("kev ok", "torch", torch.__version__, "cuda", torch.version.cuda)
    steps:
      - uses: actions/checkout@v4

      # Each image is ~8 GB (CUDA wheels) and the builder briefly holds it more than once
      # (layers, pip cache, the export for `load`). A stock runner has too little free
      # disk, so drop the preinstalled SDKs, tool cache and swap first.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Disk before build
        run: df -h /

      - name: Read build settings from .env.example
        run: |
          grep -E '^(LAYA_VERSION|KEV_REF|TORCH_INDEX)=' .env.example >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_ENV"

      # The tag compose.<name>.yaml pulls: <laya version | kev ref>-<torch index>.
      - name: Compute version tag
        run: |
          case "${{ matrix.name }}" in
            laya) echo "VERSION_TAG=${LAYA_VERSION}-${TORCH_INDEX}" >> "$GITHUB_ENV" ;;
            kev)  echo "VERSION_TAG=${KEV_REF}-${TORCH_INDEX}" >> "$GITHUB_ENV" ;;
          esac

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.VERSION_TAG }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            LAYA_VERSION=${{ env.LAYA_VERSION }}
            KEV_REF=${{ env.KEV_REF }}
            TORCH_INDEX=${{ env.TORCH_INDEX }}
          load: true
          tags: ${{ matrix.name }}:ci
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: Check image
        run: |
          df -h /
          docker image ls ${{ matrix.name }}:ci
          docker run --rm --entrypoint python ${{ matrix.name }}:ci -c '${{ matrix.check }}'

      # Same builder and inputs as the build step, so this only exports and pushes.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            LAYA_VERSION=${{ env.LAYA_VERSION }}
            KEV_REF=${{ env.KEV_REF }}
            TORCH_INDEX=${{ env.TORCH_INDEX }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
