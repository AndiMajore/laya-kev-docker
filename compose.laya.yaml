# laya-serve on an NVIDIA GPU, standalone:
#   docker compose -f compose.laya.yaml up -d
# Pulls the published image (IMAGE_PREFIX) and builds it locally if it cannot, or with
# `--build`. All settings come from .env (see .env.example).
services:
  laya:
    image: ${IMAGE_PREFIX:-ghcr.io/andimajore/laya-kev-docker}/laya:${LAYA_VERSION:-0.3.9}-${TORCH_INDEX:-cu128}
    build:
      context: .
      # `host` if the build cannot resolve DNS (VPNs, systemd-resolved setups).
      network: ${BUILD_NETWORK:-default}
      args:
        LAYA_VERSION: ${LAYA_VERSION:-0.3.9}
        TORCH_INDEX: ${TORCH_INDEX:-cu128}
    env_file:
      - path: .env
        required: false
    ports:
      # One variable for host and container port, so they cannot drift apart.
      - "${LAYA_BIND:-0.0.0.0}:${LAYA_PORT:-8000}:${LAYA_PORT:-8000}"
    volumes:
      - hf-cache:/data/hf
      # Secret files instead of plain env values (readable by UID 10001); pair each with
      # its *_FILE variable, e.g. LAYA_API_KEY_FILE=/run/secrets/laya_api_key.
      # - ./secrets/laya_api_key:/run/secrets/laya_api_key:ro
      # - ./secrets/hf_token:/run/secrets/hf_token:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LAYA_GPU_ID:-0}"]
              capabilities: [gpu]
    init: true
    restart: unless-stopped

volumes:
  hf-cache:
    # Fixed name, shared with kev and filled by `make download` (plain docker run).
    name: ${LAYA_CACHE_VOLUME:-laya-gpu-hf-cache}
