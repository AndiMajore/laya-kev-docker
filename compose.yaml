# Both servers. Used when COMPOSE_FILE is not set; .env normally picks the files, e.g.
#   COMPOSE_FILE=compose.laya.yaml                  laya only
#   COMPOSE_FILE=compose.laya.yaml:compose.kev.yaml both
# Each file also runs on its own: docker compose -f compose.kev.yaml up -d
include:
  - compose.laya.yaml
  - compose.kev.yaml
